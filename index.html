<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>레슨비서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#15201A;--paper:#F5F4EE;--card:#FFFFFF;--line:#E3E1D8;--soft:#ECEAE2;--sub:#59625B;--green:#2E6A3E;--greenSoft:#E6EFE5;--mint:#9FD3AC;--darkSub:#B9C6BC}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--ink);color:var(--paper);padding:36px 20px 26px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--green);display:flex;align-items:center;justify-content:center}
.brand b{font-size:16px}.brand small{display:block;font-size:12px;color:var(--darkSub)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--mint)}
h1{margin:0;font-size:23px;line-height:1.4}
.lead{font-size:14px;color:#D3DCD5;line-height:1.6;margin:0}
main{padding:20px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:15px;color:var(--green)}
.item{display:flex;gap:10px;font-size:15px;line-height:1.6}
.item .n{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--green)}
.p{font-size:15px;line-height:1.6;margin:0}
.task{min-height:52px;border-radius:12px;border:1px solid var(--line);background:#FBFAF6;display:flex;align-items:center;gap:12px;padding:10px 14px;text-align:left;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;width:100%}
.box{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid #9AA39C;background:#fff;display:flex;align-items:center;justify-content:center}
.on .box{background:var(--green);border-color:var(--green)}
.on span.t{color:var(--sub);text-decoration:line-through}
.note{background:var(--greenSoft);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}
.note h2{margin:0;font-size:15px;color:#1F4A2B}
.row{display:flex;justify-content:space-between;align-items:baseline}
.small{font-size:12px;color:var(--sub);line-height:1.55}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--soft)}.li:last-child{border-bottom:0}
.li b{display:block;font-size:14px}.li span{font-size:13px;color:var(--sub);line-height:1.55}
.check{min-height:58px;display:flex;align-items:center;gap:12px;padding:8px 16px;border:0;border-bottom:1px solid var(--soft);background:transparent;font:inherit;color:var(--ink);text-align:left;width:100%;cursor:pointer}
.check:last-child{border-bottom:0}.check.all{background:#FBFAF6;font-weight:700}
.tag{color:var(--green);font-weight:700}.tag.opt{color:var(--sub)}
.btn{height:56px;border-radius:14px;border:0;background:var(--ink);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.btn:disabled{background:#DAD8CF;color:#45504A;cursor:default}
.link{height:48px;border:0;background:transparent;font:inherit;font-size:14px;font-weight:600;color:#45504A;text-decoration:underline;cursor:pointer;width:100%}
.done{background:var(--greenSoft);border-radius:18px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:6px}
footer{padding:8px 20px 32px;text-align:center}
.center{padding:60px 20px;text-align:center;color:var(--sub)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{flex:none;min-width:58px;height:58px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.chip b{font-size:16px}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.slot:disabled{background:#EFEDE6;color:#A3A9A2;text-decoration:line-through;cursor:default}
.slot.on{background:var(--green);color:#fff;border-color:var(--green)}
.mine{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--soft)}.mine:last-child{border-bottom:0}
.mini{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.st.pending{background:#F7EBD9;color:#8A4E0E}.st.approved{background:var(--greenSoft);color:#1F4A2B}.st.declined,.st.withdrawn{background:#EFEDE6;color:#45504A}
textarea{width:100%;min-height:72px;border-radius:12px;border:1px solid var(--line);padding:12px;font:inherit;font-size:15px;color:var(--ink);background:#FBFAF6}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">불러오는 중…</div></div>
<script>
const SUPABASE_URL = 'https://jgunytgntbjbpfffdeaw.supabase.co';
const KEY = 'sb_publishable_fzrZnCPmhVIO8Wlm0Pq8Yw_rHH416D0';
const app = document.getElementById('app');
const q = new URLSearchParams(location.search);

async function rpc(name, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method: 'POST',
    headers: { apikey: KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  if (!r.ok) {
    let msg = String(r.status);
    try { const j = await r.json(); if (j && j.message) msg = j.message; } catch {}
    throw new Error(msg);
  }
  return r.json();
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const logo = '<div class="logo" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 240 240"><rect x="40" y="84" width="12" height="72" rx="6" fill="#9FD3AC"/><rect x="188" y="84" width="12" height="72" rx="6" fill="#9FD3AC"/><circle cx="120" cy="120" r="60" fill="#F5F4EE"/></svg></div>';
const check = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>';
function proBrand(pro, fallbackTitle, fallbackSub) {
  if (!pro || !pro.name) return `<div class="brand">${logo}<div><b>${fallbackTitle}</b><small>${fallbackSub}</small></div></div>`;
  const sub = [pro.org ? `${pro.org} 프로` : '', pro.place || ''].filter(Boolean).join(' · ');
  return `<div class="brand"><div class="logo" aria-hidden="true" style="border-radius:22px;font-size:18px;font-weight:700;color:#fff">${esc(pro.name.trim().charAt(0))}</div>
    <div><b>${esc(pro.name)}</b><small>${esc(sub || fallbackSub)}</small></div></div>${pro.intro ? `<p class="lead" style="margin-top:-4px">${esc(pro.intro)}</p>` : ''}`;
}
function fail(msg) { app.innerHTML = `<div class="center">${esc(msg)}</div>`; }

async function showLesson(token) {
  let d;
  try { d = await rpc('get_shared_lesson', { p_token: token }); } catch { return fail('일지를 불러오지 못했어요. 잠시 뒤 다시 열어주세요.'); }
  if (!d) return fail('일지를 찾을 수 없어요. 프로님께 링크를 다시 요청해 주세요.');
  const dt = new Date(d.started_at);
  const date = `${dt.getFullYear()}.${String(dt.getMonth() + 1).padStart(2, '0')}.${String(dt.getDate()).padStart(2, '0')}`;
  let done = Array.isArray(d.homework_done) ? d.homework_done.slice() : [];
  document.title = `${d.member_name || '회원'}님 레슨 일지`;
  const render = () => {
    const hw = d.homework || [];
    const count = hw.filter((_, i) => done[i]).length;
    app.innerHTML = `
      <header>
        ${proBrand(d.pro, '골프 레슨 일지', '레슨비서')}
        <div style="display:flex;flex-direction:column;gap:6px">
          <div class="mono">${date}${d.lesson_no ? ` · ${d.lesson_no}회차 레슨` : ''}</div>
          <h1>${esc(d.member_name || '회원')} 회원님의<br>오늘 레슨 일지</h1>
        </div>
      </header>
      <main>
        ${d.summary ? `<p class="p">${esc(d.summary)}</p>` : ''}
        ${(d.corrections || []).length ? `<section class="card"><h2>오늘 배운 것</h2>${d.corrections.map((c, i) => `<div class="item"><div class="n">${String(i + 1).padStart(2, '0')}</div><div>${esc(c)}</div></div>`).join('')}</section>` : ''}
        ${hw.length ? `<section class="card"><div class="row"><h2>다음 레슨까지 숙제</h2><div class="small">${count} / ${hw.length} 완료</div></div>
          ${hw.map((h, i) => `<button class="task ${done[i] ? 'on' : ''}" data-i="${i}" aria-pressed="${!!done[i]}"><span class="box">${done[i] ? check : ''}</span><span class="t">${esc(h)}</span></button>`).join('')}
          <div class="small">숙제를 하면 눌러서 체크해 주세요. 프로님께도 보여요.</div></section>` : ''}
        ${d.problems ? `<section class="card"><h2>지금 고치고 있는 점</h2><p class="p">${esc(d.problems)}</p></section>` : ''}
        ${d.next_plan ? `<section class="note"><h2>다음 레슨 계획</h2><p class="p">${esc(d.next_plan)}</p></section>` : ''}
      </main>
      <footer><div class="small">${d.audio_deleted ? '🔒 레슨 녹음 파일은 일지 작성 후 삭제되었습니다' : '🔒 레슨 녹음 파일은 일지 확인 후 삭제됩니다'}</div>
      ${d.booking_token ? `<a class="link" style="display:flex;align-items:center;justify-content:center" href="?b=${encodeURIComponent(d.booking_token)}">다음 레슨 예약 · 시간 변경 요청하기</a>` : ''}
      <div class="small">레슨비서로 작성된 일지</div></footer>`;
    app.querySelectorAll('.task').forEach((b) =>
      b.addEventListener('click', async () => {
        const i = Number(b.dataset.i);
        const next = !done[i];
        done[i] = next; render();
        try { const arr = await rpc('set_homework_done', { p_token: token, p_index: i, p_done: next }); if (Array.isArray(arr)) done = arr; }
        catch { done[i] = !next; render(); alert('저장하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
        render();
      }));
  };
  render();
}

async function showConsent(token) {
  let d;
  try { d = await rpc('get_consent', { p_token: token }); } catch { return fail('잠시 뒤 다시 열어주세요.'); }
  if (!d) return fail('링크를 찾을 수 없어요. 프로님께 다시 요청해 주세요.');
  const on = [false, false, false];
  const defs = [
    ['[필수]', '레슨 녹음 및 텍스트 변환', '일지 작성 후 녹음 파일 삭제', true],
    ['[필수]', '개인정보 수집·이용', '이름, 연락처, 레슨 기록', true],
    ['[선택]', '부상·통증 정보 기록', '레슨에 필요한 범위만 일지에 남겨요', false],
  ];
  const header = `<header>${proBrand(d.pro, '골프 레슨 녹음 안내', '첫 레슨 전 한 번만 확인해요')}
    <h1>${esc(d.member_name)} 회원님,<br>레슨 내용을 녹음해도 될까요?</h1>
    <p class="lead">녹음은 레슨 일지를 정확하게 남기기 위해서만 쓰여요. 일지가 만들어지면 녹음 파일은 지워집니다.</p></header>`;
  const info = `<section class="list">
    <div class="li"><div><b>무엇을 녹음하나요</b><span>레슨 시간 동안 프로와 회원님의 대화</span></div></div>
    <div class="li"><div><b>무엇이 남나요</b><span>글로 정리된 레슨 일지와 프로의 회원 관리 메모</span></div></div>
    <div class="li"><div><b>녹음 파일은 언제 지워지나요</b><span>프로가 일지를 확인하면 바로, 늦어도 레슨 3일 뒤 자동 삭제</span></div></div></section>`;
  const finished = (agree) => {
    app.innerHTML = `${header}<main><div class="done"><b style="font-size:17px">${agree ? '동의해 주셔서 감사해요' : '녹음 없이 레슨을 진행할게요'}</b>
      <span class="small">${agree ? '레슨이 끝나면 정리된 일지를 링크로 보내드릴게요.' : '마음이 바뀌면 이 링크에서 언제든 다시 동의할 수 있어요.'}</span></div>
      <button class="link" id="again">${agree ? '동의 철회하기' : '다시 선택하기'}</button></main>`;
    document.getElementById('again').onclick = async () => {
      if (agree) { try { await rpc('set_consent', { p_token: token, p_agree: false, p_health: false }); } catch {} return finished(false); }
      render();
    };
  };
  const render = () => {
    const all = on.every(Boolean), ready = on[0] && on[1];
    app.innerHTML = `${header}<main>${info}
      <section class="card" style="padding:0;gap:0;overflow:hidden">
        <button class="check all" data-i="all" aria-pressed="${all}"><span class="box" style="${all ? 'background:#2E6A3E;border-color:#2E6A3E' : ''}">${all ? check : ''}</span>전체 동의</button>
        ${defs.map((x, i) => `<button class="check" data-i="${i}" aria-pressed="${on[i]}"><span class="box" style="${on[i] ? 'background:#2E6A3E;border-color:#2E6A3E' : ''}">${on[i] ? check : ''}</span><span><span style="font-size:14px"><span class="tag ${x[3] ? '' : 'opt'}">${x[0]}</span> ${x[1]}</span><br><span class="small">${x[2]}</span></span></button>`).join('')}
      </section>
      <div class="small">동의는 언제든 프로에게 말하거나 이 링크에서 철회할 수 있어요. 철회하면 녹음 없이 레슨이 진행되고, 이미 남은 일지 삭제도 요청할 수 있어요.</div>
      <button class="btn" id="ok" ${ready ? '' : 'disabled'}>${ready ? '동의하기' : '필수 항목에 동의해주세요'}</button>
      <button class="link" id="no">녹음 없이 레슨만 받을게요</button></main>`;
    app.querySelectorAll('.check').forEach((b) => b.onclick = () => {
      const i = b.dataset.i;
      if (i === 'all') { const v = !on.every(Boolean); on.fill(v); } else on[Number(i)] = !on[Number(i)];
      render();
    });
    document.getElementById('ok').onclick = async () => {
      try { await rpc('set_consent', { p_token: token, p_agree: true, p_health: on[2] }); finished(true); }
      catch { alert('저장하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
    };
    document.getElementById('no').onclick = async () => {
      try { await rpc('set_consent', { p_token: token, p_agree: false, p_health: false }); } catch {}
      finished(false);
    };
  };
  if (d.consented_at) finished(true); else render();
}

const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const two = (n) => String(n).padStart(2, '0');
const fmt = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}월 ${d.getDate()}일(${DOW[d.getDay()]}) ${two(d.getHours())}:${two(d.getMinutes())}`; };
const KIND = { new: '새 레슨 예약', change: '시간 변경', cancel: '레슨 취소' };
const STATUS = { pending: '프로님 확인 중', approved: '확정', declined: '어려워요', withdrawn: '요청 취소함' };

async function showBooking(token) {
  let d;
  try { d = await rpc('get_booking', { p_token: token }); } catch { return fail('잠시 뒤 다시 열어주세요.'); }
  if (!d) return fail('링크를 찾을 수 없어요. 프로님께 다시 요청해 주세요.');
  document.title = '레슨 예약';
  let pick = null; // { kind, schedule_id, date, from }
  let day = 0, slot = null;

  const header = () => `<header>${proBrand(d.pro, '레슨 예약', '레슨비서')}
    <h1>${esc(d.member_name)} 회원님,<br>${pick ? (pick.kind === 'new' ? '원하는 레슨 시간을 골라주세요' : '바꾸고 싶은 시간을 골라주세요') : '예약·변경을 도와드릴게요'}</h1></header>`;

  const busyAt = (start, end) => (d.busy || []).some((b) => {
    if (pick && pick.from && new Date(b.start).getTime() === new Date(pick.from).getTime()) return false;
    return new Date(b.start) < end && new Date(b.end) > start;
  });

  const home = () => {
    pick = null; slot = null;
    const mine = d.mine || [];
    const reqs = d.requests || [];
    app.innerHTML = `${header()}<main>
      <section class="card"><h2>예정된 내 레슨</h2>
        ${mine.length ? mine.map((m, i) => `<div class="mine"><div style="flex:1;font-size:15px;font-weight:600">${fmt(m.start)}</div>
          <button class="mini" data-ch="${i}">시간 변경</button><button class="mini" data-cx="${i}">취소</button></div>`).join('')
          : '<p class="small" style="margin:0">앞으로 4주 동안 잡힌 레슨이 없어요.</p>'}
      </section>
      <button class="btn" id="new">+ 새 레슨 예약 요청</button>
      ${reqs.length ? `<section class="card"><h2>내 요청</h2>${reqs.map((r) => `<div class="mine"><div style="flex:1;display:flex;flex-direction:column;gap:2px">
          <span style="font-size:14px;font-weight:600">${KIND[r.kind]}${r.requested_start ? ` · ${fmt(r.requested_start)}` : r.from_start ? ` · ${fmt(r.from_start)}` : ''}</span>
          ${r.kind === 'change' && r.from_start ? `<span class="small">기존 ${fmt(r.from_start)}</span>` : ''}</div>
          <span class="st ${r.status}">${STATUS[r.status]}</span>${r.status === 'pending' ? `<button class="mini" data-wd="${esc(r.id)}">요청 취소</button>` : ''}</div>`).join('')}</section>` : ''}
      <div class="small" style="text-align:center">요청을 보내면 프로님이 확인 후 확정해 드려요.</div>
    </main>`;
    document.getElementById('new').onclick = () => { pick = { kind: 'new' }; picker(); };
    app.querySelectorAll('[data-ch]').forEach((b) => b.onclick = () => { const m = mine[Number(b.dataset.ch)]; pick = { kind: 'change', schedule_id: m.schedule_id, date: m.date, from: m.start }; picker(); });
    app.querySelectorAll('[data-cx]').forEach((b) => b.onclick = async () => {
      const m = mine[Number(b.dataset.cx)];
      if (!confirm(`${fmt(m.start)} 레슨 취소를 요청할까요?`)) return;
      await send({ p_kind: 'cancel', p_schedule_id: m.schedule_id, p_date: m.date, p_requested_start: null, p_note: null });
    });
    app.querySelectorAll('[data-wd]').forEach((b) => b.onclick = async () => {
      try { d = await rpc('withdraw_booking', { p_token: token, p_id: b.dataset.wd }); home(); } catch (e) { alert(e.message); }
    });
  };

  const send = async (args) => {
    try { d = await rpc('request_booking', { p_token: token, ...args }); alert('요청을 보냈어요. 프로님이 확인하면 확정돼요.'); home(); }
    catch (e) { alert(/^\d+$/.test(e.message) ? '요청을 보내지 못했어요. 잠시 뒤 다시 해주세요.' : e.message); }
  };

  const picker = () => {
    const dur = d.duration_min || 50;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const days = Array.from({ length: 21 }, (_, i) => { const x = new Date(today); x.setDate(x.getDate() + i); return x; });
    const base = days[day];
    const now = new Date();
    const slots = [];
    const steps = dur < 30 ? [0, 15, 30, 45] : [0, 30];
    for (let h = 6; h <= 22; h++) for (const mm of steps) {
      const st = new Date(base); st.setHours(h, mm, 0, 0);
      const en = new Date(st.getTime() + dur * 60000);
      if (en.getHours() > 23 || (en.getHours() === 23 && en.getMinutes() > 0)) continue;
      slots.push({ st, off: st <= now || busyAt(st, en) });
    }
    app.innerHTML = `${header()}<main>
      ${pick.kind === 'change' ? `<div class="small">기존 레슨: <b>${fmt(pick.from)}</b></div>` : ''}
      <section class="card"><h2>날짜</h2><div class="chips">${days.map((x, i) => `<button class="chip ${i === day ? 'on' : ''}" data-day="${i}"><span>${i === 0 ? '오늘' : DOW[x.getDay()]}</span><b>${x.getDate()}</b></button>`).join('')}</div></section>
      <section class="card"><div class="row"><h2>시간</h2><span class="small">${dur}분 레슨 · 회색은 이미 찬 시간</span></div>
        <div class="slots">${slots.map((x, i) => `<button class="slot ${slot && slot.getTime() === x.st.getTime() ? 'on' : ''}" data-slot="${i}" ${x.off ? 'disabled' : ''}>${two(x.st.getHours())}:${two(x.st.getMinutes())}</button>`).join('')}</div></section>
      <textarea id="note" placeholder="프로님께 남길 말 (선택)"></textarea>
      <button class="btn" id="go" ${slot ? '' : 'disabled'}>${slot ? `${fmt(slot.toISOString())} 으로 요청하기` : '시간을 골라주세요'}</button>
      <button class="link" id="back">돌아가기</button></main>`;
    app.querySelectorAll('[data-day]').forEach((b) => b.onclick = () => { day = Number(b.dataset.day); slot = null; picker(); });
    app.querySelectorAll('[data-slot]').forEach((b) => b.onclick = () => { slot = slots[Number(b.dataset.slot)].st; const n = document.getElementById('note').value; picker(); document.getElementById('note').value = n; });
    document.getElementById('back').onclick = home;
    document.getElementById('go').onclick = () => {
      if (!slot) return;
      send({ p_kind: pick.kind, p_schedule_id: pick.schedule_id || null, p_date: pick.date || null, p_requested_start: slot.toISOString(), p_note: document.getElementById('note').value });
    };
  };
  home();
}

if (q.get('l')) showLesson(q.get('l'));
else if (q.get('b')) showBooking(q.get('b'));
else if (q.get('c')) showConsent(q.get('c'));
else fail('레슨비서 · 골프 프로의 레슨 일지 비서');
</script>
</body>
</html>
